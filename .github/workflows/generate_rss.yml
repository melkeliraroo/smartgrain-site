name: Generate RSS

on:
  push:
    paths:
      - 'blog/artigos.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-rss:
    name: Generate RSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run RSS generator
        run: |
          python blog/generate_rss.py

      - name: Commit RSS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/rss.xml
          git diff --staged --quiet || (git commit -m "chore: update blog RSS" && git push)
